name: Windows AnyDesk
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Set password
        run: net user runneradmin P@ssw0rd123!@#

      - name: Install AnyDesk
        run: |
          Invoke-WebRequest https://download.anydesk.com/AnyDesk.exe -OutFile AnyDesk.exe
          Start-Process .\AnyDesk.exe -ArgumentList "--install AnyDesk --start --silent" -Wait
          Start-Sleep -Seconds 15
          Start-Service AnyDesk -ErrorAction SilentlyContinue
          Start-Process "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          Start-Sleep -Seconds 30
          $id = & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id
          Write-Host "=== ANYDESK ID KAMU: $id ==="
          echo "ID: $id"
          Start-Sleep -Seconds 3600
