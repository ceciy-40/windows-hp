name: Windows AnyDesk
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Set password
        run: net user runneradmin P@ssw0rd123!@#

      - name: Install AnyDesk
        run: |
          Invoke-WebRequest https://download.anydesk.com/AnyDesk.exe -OutFile AnyDesk.exe
          .\AnyDesk.exe --install --start --silent
          Start-Sleep -Seconds 20
          for ($i=0; $i -lt 5; $i++) { .\AnyDesk.exe --get-id; Start-Sleep -Seconds 5 }
          Start-Sleep -Seconds 3600
